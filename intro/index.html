<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intro 5 Detik</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 55%, #4c1d95 100%);
      font-family: "Helvetica Neue", Arial, sans-serif;
      color: #fff;
    }
    .glow {
      position: absolute;
      left: 760px; top: 340px;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(167,139,250,0.55) 0%, rgba(167,139,250,0) 70%);
    }
    .line {
      position: absolute;
      left: 560px; top: 560px;
      width: 800px; height: 6px;
      border-radius: 3px;
      background: linear-gradient(90deg, #a78bfa, #38bdf8);
      transform-origin: left center;
    }
    #title {
      position: absolute;
      left: 0; top: 400px;
      width: 1920px;
      text-align: center;
      font-size: 150px;
      font-weight: 800;
      letter-spacing: 6px;
    }
    #subtitle {
      position: absolute;
      left: 0; top: 610px;
      width: 1920px;
      text-align: center;
      font-size: 48px;
      font-weight: 400;
      letter-spacing: 10px;
      color: #c4b5fd;
    }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="intro" data-start="0" data-width="1920" data-height="1080">

    <div id="glow" class="glow clip" data-start="0" data-duration="5" data-track-index="0"></div>

    <div id="line" class="line clip" data-start="0" data-duration="5" data-track-index="1"></div>

    <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="2">NAMA KANAL</h1>

    <p id="subtitle" class="clip" data-start="0" data-duration="5" data-track-index="3">SELAMAT DATANG</p>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Cahaya membesar pelan sepanjang video
      tl.fromTo("#glow", { scale: 0.6, opacity: 0 }, { scale: 1.6, opacity: 1, duration: 5, ease: "power1.out" }, 0);

      // Garis memanjang
      tl.fromTo("#line", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, 0.3);

      // Judul masuk dari bawah
      tl.fromTo("#title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.7);

      // Subjudul menyusul
      tl.fromTo("#subtitle", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 1.5);

      // Semua memudar di akhir
      tl.to(["#title", "#subtitle", "#line"], { opacity: 0, duration: 0.6, ease: "power1.in" }, 4.4);

      window.__timelines = window.__timelines || {};
      window.__timelines.intro = tl;
    </script>
  </div>
</body>
</html>
